id: DEC-0009
name: Shared Visual Identity
context: >-
  The cockpit, documentation and repository READMEs share the Please Behave
  identity. The original mark was a raster image with a fixed background.
decision: >-
  Use the transparent vector masters and semantic light and dark tokens in
  the Visual Identity document (../../brand/README.md). Reserve brand colors
  for identity and use the dedicated status tokens for outcomes. Pair every
  status color with a visible label or distinct symbol and provide an accessible
  name when the symbol stands alone. Meet WCAG 2.2 AA contrast for text and
  meaningful interface elements using the verified pairings in that document.
rationale: >-
  A shared mark and palette keep the product recognizable across components.
  Semantic tokens let each theme express the same meaning. Distinct labels or
  symbols keep outcomes understandable when color alone is insufficient.
