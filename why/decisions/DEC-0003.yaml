id: DEC-0003
name: One Repository per Component
context: >-
  Components have distinct responsibilities and maintain their own Why
  artifacts. Artifact IDs can recur in different repositories.
decision: >-
  Each component has its own repository. Qualify references to artifacts in
  another repository with that repository's name, for example why:DEC-0001.
rationale: >-
  Repository boundaries keep code and its governing artifacts together.
  Qualified IDs identify the owning repository and resolve ambiguity.
