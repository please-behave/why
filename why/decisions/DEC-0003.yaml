id: DEC-0003
name: One Repository per Component
context: >-
  Components have distinct responsibilities and maintain their own Why
  artifacts. Artifact IDs can recur in different repositories.
decision: >-
  Each component has its own repository. References to another repository use
  the alias declared according to the
  [Why standard](../../standard/README.md#artifact-references).
rationale: >-
  Repository boundaries keep code and its governing artifacts together.
  Declared aliases keep references unambiguous when a repository is renamed.
