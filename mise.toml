include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=29f7071f4b285c228ea4206693a5c397f693a966",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=356256b67beed2419a0691611bb71aa3736c326e",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=356256b67beed2419a0691611bb71aa3736c326e",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/why/mise.toml?ref=eeda3e8ee070b9822b2a2938b7f27c6284ac3703",
]

[tools]
"github:please-behave/cli" = "0.25.0"
python = "3.15.2"

[tasks.format]
description = "Format shell scripts"
run = "shfmt -w ."

[tasks.verify]
description = "Run the deterministic checks used by CI"
run = "GITHUB_REPOSITORY=please-behave/why please run --at check --checks-only"

[tasks.setup]
description = "Prepare the repository for CI and offline Git hooks"
run = "true"
