include = [
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/repository-conventions/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/security/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/open-source-software/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
  "git::https://github.com/christianpflugradt/repository-catalog.git//rulesets/why/mise.toml?ref=0b01148cebac72b4563f8ebebce0c39b0a1431ea",
]

[tools]
"github:please-behave/cli" = "0.21.0"
python = "3.15.2"

[tasks.format]
description = "Format shell scripts"
run = "shfmt -w ."

[tasks.verify]
description = "Run the deterministic checks used by CI"
run = "GITHUB_REPOSITORY=please-behave/why please run --at check --checks-only"

[tasks.setup]
description = "Prepare the repository for CI and offline Git hooks"
run = "true"
